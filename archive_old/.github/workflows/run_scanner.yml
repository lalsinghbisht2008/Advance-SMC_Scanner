name: SMC Multi-Asset Scanner Suite

on:
  schedule:
    - cron: '*/2 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan Mode'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - test_all_batches
      send_test_alert:
        description: 'Send Telegram Test Ping'
        required: false
        default: false
        type: boolean

jobs:
  run-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pytz yfinance

      - name: Run SMC Live Scanner
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ github.event.inputs.scan_mode }}
          SEND_TEST_ALERT: ${{ github.event.inputs.send_test_alert }}
        run: python smc_live_scanner.py

      - name: Run SMC Swing Scanner
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ github.event.inputs.scan_mode }}
        run: python smc_swing_scanner.py

      - name: Commit & Push Trade State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_trades.json trade_history.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update active trade state [skip ci]"
          git pull origin main --rebase || true
          git push origin main || true
