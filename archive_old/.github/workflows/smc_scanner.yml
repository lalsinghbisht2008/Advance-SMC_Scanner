name: SMC Dual-Timeframe Multi-Asset Scanner

on:
  schedule:
    # Runs every 3 minutes Monday to Friday between 03:30 UTC to 10:30 UTC (9:00 AM IST to 4:00 PM IST)
    - cron: '*/3 3-10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-smc-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pytz

      - name: Execute SMC Live Scanner (3-Min Auto Batch)
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: 'normal'
        run: |
          python smc_live_scanner.py

      - name: Commit and Push Updated Active Trades State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_trades.json || true
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update active trades state [skip ci]" && git push)
