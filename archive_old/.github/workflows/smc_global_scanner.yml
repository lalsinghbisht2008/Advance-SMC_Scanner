name: SMC Global Market Scanner

on:
  schedule:
    # Runs every 5 minutes 24/7 for Global Markets
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-global-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy yfinance

      - name: Run Global SMC Scanner (XAU, XAG, BTC)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python smc_global_scanner.py

      - name: Commit & Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update global trade states" || echo "No changes to commit"
          git push
