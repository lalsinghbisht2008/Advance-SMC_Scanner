name: Nifty Intraday 1M SMC Scanner

on:
  schedule:
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nifty-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nifty Intraday Scanner & Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nifty_intraday_scanner.py

      - name: Commit and Save Trade State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add active_trades.json || true
          git commit -m "Update active trade tracking state [skip ci]" || true
          git push || true
